# Configuration Docker Compose pour NAS
# Usage: docker compose -f docker-compose.nas.yml up -d
#
# Chemins Synology (projet actuel) : /volume1/docker/apps/PeintreAB
#
# HTTPS : terminez TLS sur le reverse proxy NAS (Let’s Encrypt), pas dans Node.
# Voir README_NAS_DEPLOYMENT.md § Reverse Proxy + SSL.

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: peintreab-db
    environment:
      POSTGRES_DB: ${DB_NAME:-peintreab_db}
      POSTGRES_USER: ${DB_USER:-peintreab_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Définissez DB_PASSWORD dans .env}
    # Postgres uniquement en local sur le NAS (pas exposé sur Internet)
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /volume1/docker/apps/PeintreAB/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-peintreab_user} -d ${DB_NAME:-peintreab_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: peintreab-backend
    # API accessible seulement en local ; le reverse proxy NAS proxyfie /api
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-peintreab_db}
      - DB_USER=${DB_USER:-peintreab_user}
      - DB_PASSWORD=${DB_PASSWORD:?Définissez DB_PASSWORD dans .env}
      - FRONTEND_URL=https://www.alexandre-bindl.fr
      - JWT_SECRET=${JWT_SECRET:?Définissez JWT_SECRET dans .env}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-12h}
      # ADMIN_* : uniquement via env_file ./backend/.env
    volumes:
      - /volume1/docker/apps/PeintreAB/backend/src:/app/src
      - /volume1/docker/apps/PeintreAB/backend/migrations:/app/migrations
      - /volume1/docker/apps/PeintreAB/backend/.env:/app/.env
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm install && sleep 2 && npm run migrate && npm start"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: peintreab-frontend
    # Frontend local ; reverse proxy HTTPS → 5173
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - /volume1/docker/apps/PeintreAB/src:/app/src
      - /volume1/docker/apps/PeintreAB/public:/app/public
      - /volume1/docker/apps/PeintreAB/index.html:/app/index.html
      - /volume1/docker/apps/PeintreAB/vite.config.js:/app/vite.config.js
      - /volume1/docker/apps/PeintreAB/package.json:/app/package.json
      - /volume1/docker/apps/PeintreAB/package-lock.json:/app/package-lock.json
      - /app/node_modules
    environment:
      - NODE_ENV=production
      - VITE_API_URL=/api
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    stdin_open: true
    tty: true
    restart: unless-stopped
